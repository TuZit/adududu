# SonarQube Community Build (free) + Postgres, for scripts/run_sonarqube_performance.sh
# Works with Docker and Podman. Detect the right command with scripts/container_engine.sh
# ($CONTAINER_COMPOSE), or use:
#
#   docker compose -f scripts/docker-compose.yml up -d      # Docker
#   podman-compose -f scripts/docker-compose.yml up -d      # Podman
#   # first boot ~1 min, then open http://localhost:9000 (admin / admin)
#   # My Account -> Security -> Generate Tokens (Global Analysis) -> export SONAR_TOKEN
#   SONAR_TOKEN=<token> bash scripts/run_sonarqube_performance.sh /path/to/project
#
#   docker compose -f scripts/docker-compose.yml down       # stop (keep data)
#   docker compose -f scripts/docker-compose.yml down -v    # stop and wipe data
version: "3.8"
services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: perf-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db

  db:
    image: postgres:13
    container_name: perf-sonar-postgres
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
